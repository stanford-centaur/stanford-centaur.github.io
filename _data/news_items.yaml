- title: "cvc5 and Bitwuzla win FLoC Olympic Games awards at FLoC 2026"
  excerpt: "Two solvers developed at Centaur were honored at the FLoC 2026 Olympic Games award ceremony in Lisbon. <b>cvc5</b> received the award for <b>Best Overall Ranking in SMT-COMP 2025 and 2026</b>, for winning the best overall ranking in three of the four main tracks of SMT-COMP 2026 (Single Query, Incremental, and Model Validation) and in all four main tracks in 2025 (adding Unsat Core). <b>Bitwuzla</b>, developed by Aina Niemetz and Mathias Preiner, received an award for <b>consistently outstanding performance in bit-vector logics</b>. The cvc5 award recognizes Haniel Barbosa, Clark Barrett, Lydia Kondylidou, Hanna Lachnitt, Daniel Larraz, Abdalrhman Mohamed, Mudathir Mohamed, José Neto, Aina Niemetz, Alex Ozdemir, Mathias Preiner, Andrew Reynolds, Hans-Jörg Schurr, Cesare Tinelli, and Yoni Zohar."
