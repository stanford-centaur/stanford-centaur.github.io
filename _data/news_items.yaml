- title: "Benjamin Przybocki awarded Churchill Scholarship"
  urls:
    - url: "https://news.stanford.edu/report/2024/01/22/two-stanford-students-win-churchill-scholarship/"
      label: "Stanford News on Churchill Scholarship"
    - url: "https://cra.org/crn/2024/01/outstanding-undergraduate-research-awards-winners-announcement/"
      label: "CRA Announcement"
  excerpt: "Benjamin Przybocki was awarded the Churchill Scholarship for a year of independent research at Cambridge and selected as a runner-up for the Computing Research Association (CRA) Outstanding Undergraduate Research Award!"
  date: "2024-01-18"

- title: "Benjamin Przybocki named a runner-up for the CRA Outstanding Undergraduate Researcher Award"
  excerpt: "Benjamin Przybocki has been named a runner-up for the Computing Research Association's 2024 Outstanding Undergraduate Researcher Award, which recognizes undergraduate students in North American universities who show outstanding potential in an area of computing research. Ben's research in automated reasoning includes results on the theory of finite sequences and on combinations of first-order theories."
  urls:
    - url: "https://cra.org/crn/2024/01/outstanding-undergraduate-research-awards-winners-announcement/"
      label: "CRA Announcement"
    - url: "https://cra.org/about/awards/outstanding-undergraduate-researcher-award/#tab-id-3"
      label: "CRA Outstanding Undergraduate Researcher Award"
  date: "2024-01-02"

- title: "Haoze Wu joining Amherst College"
