- title: "Launch of CSLib, the Lean Computer Science Library"
  excerpt: "CSLib, an open-source effort to formalize computer science in the Lean 4 theorem prover, has officially launched. Inspired by Mathlib's impact on mathematics, CSLib has two pillars: formalizing core computer science concepts in Lean, and building Lean infrastructure for reasoning about real-world code. The project also aims to advance neurosymbolic approaches that connect modern AI with formal reasoning. Clark Barrett serves on the CSLib Steering Committee with Swarat Chaudhuri, Fabrizio Montesi, Jim Grundy, Pushmeet Kohli, and Leo de Moura. Researchers, practitioners, and enthusiasts are invited to get involved."
  urls:
    - url: "https://cslib.io"
      label: "CSLib"
    - url: "https://arxiv.org/abs/2602.04846"
      label: "White Paper"
    - url: "https://github.com/leanprover/cslib/blob/main/CONTRIBUTING.md"
      label: "How to Contribute"
  date: "2026-02-20"

